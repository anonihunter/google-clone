<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Google-com Clone</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <div class="header">
            <div class="left">
                <div>About</div>
                <div>Store</div>
            </div>
            
            <nav class="navbar">
                
                <div>Gmail</div>
                <div>Images</div>
                
                <div class="dots"><img src="Images/dot icon.png" alt="Google Apps" title="Google Apps" class="dot_icon"></div>
                <div class="right_last">
                    <button class="sign_in_btn">Sign In</button>
                </div>
                

            </nav>
        </div>

        <img src="Images/google_logo.png" alt="google-logo" class="google-logo">
        
        <div class="search">
            <div class="left_box_search_bar">
                <img src="Images/search_icon.png" alt="" class="search_icon">
            </div>
            <input type="text" class="search_bar">
            <div class="right_box_search_bar">
                <div><img src="Images/Voice-512.webp" alt="" class="voice_icon"></div>
                <div><img src="Images/Google_lens.webp" alt="" class="google_lens"></div>
            </div>
        </div>


        <div class="div-google-search-buttons">
            <center class="center-div">
                <button class="google-search">Google Search</button>
                <button class="im-feeling-lucky">I'm Feeling Lucky</button>
            </center>
        </div>

        <div class="google-lang">
            <p class="google-offered-in"> <span style="color: black;">Google offered in:</span> <span><a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">हिन्दी  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">বাংলা</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">తెలుగు</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">मराठी</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">தமிழ்</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">ગુજરાતી</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">ಕನ್ನಡ</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">മലയാളം</a>  <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer" class="hyperlink">ਪੰਜਾਬੀ</a></span></p>
        </div>
        
        
        <footer class="footer">
            <div class="section_1">
                <div>India</div>
            </div>
            <div class="section_2">
                
                <div class="left_footer">
                    <div>Advertising</div>
                    <div>Business</div>
                    <div>How Search works</div>
                </div>

                <div class="right_footer">
                    <div>Privacy</div>
                    <div>Terms</div>
                    <div>Settings</div>
                </div>

            </div>
        </footer>

    </body>
</html>
